# Group C16: ext-class is in BOTH mappings; external must win.
image:
  registry: i2g-e2e-local
  repository: ingress2gateway-controller
  tag: e2e
  pullPolicy: Never

controller:
  leaderElection: false
  defaultProvider: ingress-nginx
  defaultEmitter: standard
  ingressSelectionMode: ingressclass
  ingressClassToGatewayClassMapping:
    nginx-test: test-gc
    ext-class: test-gc
  ingressClassToExternalGatewayMapping:
    ext-class: ext-ns/shared-gw
