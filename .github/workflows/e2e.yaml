name: E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    name: Kind Helm E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: i2g-e2e
          wait: 120s

      - name: Run e2e tests
        env:
          E2E_CLUSTER_NAME: i2g-e2e
          E2E_USE_EXISTING_CLUSTER: "true"
          E2E_KEEP_CLUSTER: "true"
          E2E_ARTIFACTS_DIR: ./e2e-artifacts
        run: go test -tags e2e -timeout 20m -v ./test/e2e/...

      - name: Upload e2e artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: e2e-artifacts/
          if-no-files-found: ignore
