# Example: TLS Passthrough Conversion Mode (TLSRoute)
#
# This example demonstrates creating a Gateway with a TLS Passthrough listener
# and a TLSRoute resource matching SNI hostnames.
#
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tls-passthrough
  namespace: default
  annotations:
    ingress2gateway.io/enabled: "true"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 443
